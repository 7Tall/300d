<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>300 giorni con Aletta 🫀</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#2b0d16 0%,#18070d 45%,#090305 100%);
  color:white;
  overflow:hidden;
  height:100vh;
  position:relative;

  transform: translateZ(0);
  will-change: transform;
}

body.beat{
  animation:screenBeat 0.35s ease;
}

@keyframes screenBeat{
  0%{transform:scale(1);}
  25%{transform:scale(1.015);}
  50%{transform:scale(0.995);}
  100%{transform:scale(1);}
}

.background-heart{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0.07;
  font-size:240px;
  animation:heartBeat 1.1s infinite;
}

@keyframes heartBeat{
  0%{transform:scale(1);}
  14%{transform:scale(1.12);}
  28%{transform:scale(1);}
  42%{transform:scale(1.08);}
  70%{transform:scale(1);}
}

.container{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:24px;
  text-align:center;
}

.top-text{
  font-size:1.5rem;
  font-weight:800;
  margin-bottom:22px;
}

.heart-main{
  font-size:5.5rem;
  margin-bottom:28px;
  animation:heartBeat 1.1s infinite;
  filter:drop-shadow(0 0 18px rgba(255,50,80,0.4));
}

.counter-widget{
  width:100%;
  max-width:360px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border-radius:34px;
  padding:36px 18px;
  margin-bottom:34px;
}

.days{
  font-size:6rem;
  font-weight:900;
  letter-spacing:-5px;
}

.days-label{
  margin-top:12px;
  opacity:0.7;
  font-size:0.85rem;
  letter-spacing:2px;
}

.pre-button{
  margin-bottom:14px;
  opacity:0.62;
  font-size:0.95rem;
}

button{
  border:none;
  background:linear-gradient(135deg,#ff3d6e,#ff6b81);
  color:white;
  padding:18px 32px;
  border-radius:999px;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
}

.slider{
  position:fixed;
  left:0;
  bottom:-100%;
  width:100%;
  height:72vh;
  background:linear-gradient(180deg,#250f16f8,#0f0508ff);
  border-top-left-radius:34px;
  border-top-right-radius:34px;
  padding:34px 28px;
  transition:0.6s ease;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:space-between;

  transform: translateZ(0);
  will-change: transform;
}

.slider.active{
  bottom:0;
}

.handle{
  width:70px;
  height:6px;
  background:rgba(255,255,255,0.25);
  border-radius:999px;
  margin:0 auto 20px auto;
}

.slide-content{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:1.25rem;
  font-weight:600;
  line-height:1.9;
  white-space:pre-line;
  opacity:0;
  transform:translateY(10px);
  transition:0.4s;
}

.slide-content.show{
  opacity:1;
  transform:translateY(0);
}

.bottom-zone{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.dots{
  display:flex;
  gap:8px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,0.25);
}

.dot.active{
  background:#ff5d84;
  transform:scale(1.3);
}

.close-btn{
  background:rgba(255,255,255,0.08);
  border:none;
  color:white;
  padding:14px 24px;
  border-radius:18px;
  font-weight:700;
}

.explosion-heart{
  position:fixed;
  font-size:28px;
  pointer-events:none;
  z-index:999;
  animation:explode 3s ease-out forwards;
}

@keyframes explode{
  0%{
    transform:translate(0,0) scale(0.4);
    opacity:1;
  }
  100%{
    transform:translate(var(--x), var(--y)) scale(1.8);
    opacity:0;
  }
}

</style>
</head>

<body>

<div class="background-heart">🫀</div>

<div class="container">

<div class="top-text">300 giorni con Aletta</div>

<div class="heart-main">🫀</div>

<div class="counter-widget">
<div class="days" id="daysCounter">0</div>
<div class="days-label">GIORNI INSIEME</div>
</div>

<div class="pre-button">premi per rendere strana la situazione</div>

<button onclick="openSlider()">shufi e leggi</button>

</div>

<div class="slider" id="slider">

<div class="handle"></div>

<div class="slide-content show" id="slideText"></div>

<div class="bottom-zone">
<div class="dots" id="dots"></div>
<button class="close-btn" onclick="closeSlider()">torna indietro</button>
</div>

</div>

<script>

let count = 0;
let counting = true;

const counter = document.getElementById('daysCounter');
const slider = document.getElementById('slider');

function triggerBeat(){
  document.body.classList.remove('beat');
  void document.body.offsetWidth;
  document.body.classList.add('beat');
  if(navigator.vibrate) navigator.vibrate(35);
}

function explodeHearts(){

  slider.style.transform = "translateZ(0)";

  for(let i=0;i<45;i++){

    const heart = document.createElement('div');
    heart.classList.add('explosion-heart');
    heart.innerHTML = '🫀';
    heart.style.left = window.innerWidth/2 + 'px';
    heart.style.top = window.innerHeight/2 + 'px';

    heart.style.setProperty('--x',(Math.random()*700-350)+'px');
    heart.style.setProperty('--y',(Math.random()*700-350)+'px');

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),3000);
  }

  triggerBeat();

  setTimeout(()=>{
    slider.style.transform = "";
  },3000);
}

setInterval(()=>{

  if(!counting) return;

  counter.innerText = count;

  if(count >= 300){

    counting = false;
    explodeHearts();

    setTimeout(()=>{
      count = 0;
      counting = true;
    },3000);

    return;
  }

  count++;

},18);


// SLIDES

const slides = [

`quando mi hai detto che ti piacevo più di un amico, 
ho sentito il cuore fermarsi per un attimo.`,

`non perché non lo volessi, ma perché avevo paura, 
paura di non essere abbastanza, paura di rovinare qualcosa di bello.`,

'ricordo i tuoi occhi, la tensione, il coraggio.',

`io non so se te l’ho mai detto davvero, 
ma quel momento lo porto addosso come una cicatrice bella.`,

'è stato l’istante in cui qualcosa dentro di me ha deciso di provarci sul serio.',

`a volte penso che l’amore inizi proprio così,
non con le dichiarazioni,
ma con qualcuno che ti guarda mentre mostri una parte delicata di te
e decide di restare.`

];

let current = 0;

const slideText = document.getElementById('slideText');
const dots = document.getElementById('dots');

slides.forEach((_,i)=>{
  const d = document.createElement('div');
  d.classList.add('dot');
  if(i===0) d.classList.add('active');
  dots.appendChild(d);
});

function updateSlide(){

  slideText.classList.remove('show');

  setTimeout(()=>{

    slideText.innerText = slides[current];
    slideText.classList.add('show');

    document.querySelectorAll('.dot')
    .forEach((d,i)=>{
      d.classList.toggle('active', i===current);
    });

    triggerBeat();

  },200);
}

updateSlide();

function nextSlide(){
  if(current < slides.length-1){
    current++;
    updateSlide();
  }
}

function prevSlide(){
  if(current > 0){
    current--;
    updateSlide();
  }
}


// SWIPE

let startX=0,startY=0;

slider.addEventListener('touchstart',e=>{
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

slider.addEventListener('touchend',e=>{
  let dx = startX - e.changedTouches[0].clientX;
  let dy = startY - e.changedTouches[0].clientY;

  if(dx > 50) nextSlide();
  if(dx < -50) prevSlide();
  if(dy < -80) closeSlider();
});

function openSlider(){
  slider.classList.add('active');
  triggerBeat();
}

function closeSlider(){
  slider.classList.remove('active');
}

</script>

</body>
</html>
